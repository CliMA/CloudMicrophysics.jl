name: Doc Preview Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  doc-preview-cleanup:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: versions.js
          sparse-checkout-cone-mode: false

      - name: List closed PRs with a preview
        run: |
            for preview in $(git -C gh-pages ls-tree --name-only HEAD previews/); do
              pr=${preview#previews/PR}
              state=$(gh pr view "$pr" --json state --jq .state)
              if [ "$state" != OPEN ]; then
                echo "$pr"
              fi
            done > closed_prs.txt
            cat closed_prs.txt
        env:
            GH_TOKEN: ${{ github.token }}

      - name: Prune gh-pages
        run: |
            git -C gh-pages config user.name "Documenter.jl"
            git -C gh-pages config user.email "documenter@juliadocs.github.io"
            bash .github/scripts/prune_gh_pages.sh gh-pages closed_prs.txt
