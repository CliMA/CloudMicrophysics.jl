# Copy of ClimaCoupler.jl toml/amip_progedmf_1m.toml (origin/main f6be56e9), the
# parameter file that replaces the atmos TOML in the coupler benchmark
# config/benchmark_configs/amip_progedmf_1m_land_he16.yml, without
# `ogw_smoothing_scale_fraction`: `set_CM_cache.jl` strips the orographic
# gravity wave drag, and ClimaParams rejects an override nothing reads.

[zd_rayleigh]
value = 40000.0

[zd_viscous]
value = 40000.0

[alpha_rayleigh_tracer]
value = 0.001

[EDMF_max_surface_area]
value = 0.1

[EDMF_min_area]
value = 1.0e-5

[EDMF_max_area]
value = 0.7

[entr_inv_tau]
value = 0

[entr_coeff]
value = 0.3

[min_area_limiter_scale]
value = 0.001

[min_area_limiter_power]
value = 1

[entr_detr_limit_inv_tau]
value = 0

[detr_inv_tau]
value = 0

[detr_coeff]
value = 0

[detr_buoy_coeff]
value = 1

[detr_vertdiv_coeff]
value = 0

[detr_massflux_vertdiv_coeff]
value = 0.3

[max_area_limiter_scale]
value = 0.001

[max_area_limiter_power]
value = 1

[mixing_length_Prandtl_maximum]
value = 100

[sgs_ice_uniform_fraction]
value = 0.0

[sgs_liquid_uniform_fraction]
value = 0.0

[condensation_evaporation_timescale]
value = 10

[sublimation_deposition_timescale]
value = 3600

[rain_autoconversion_timescale]
value = 1200

[snow_autoconversion_timescale]
value = 1360

[cloud_liquid_water_specific_humidity_autoconversion_threshold]
value = 1.25e-4

[cloud_liquid_water_specific_humidity_autoconversion_threshold_stratiform_scale]
value = 2.0

[rain_autoconversion_velocity_scale]
value = 0.05

[cloud_ice_specific_humidity_autoconversion_threshold]
value = 5e-6

[cloud_ice_number_max]
value = 1.0e5

[cloud_ice_number_temperature_fit_prefactor]
value = 3000.0

[cloud_fraction_steepness_scale]
value = 1.2

[snow_apparent_density]
value = 200.0
